<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suika Game Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');
        
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none; /* スマホでのスクロールを防止 */
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            margin: 0 auto;
            background-color: #ffe8b6;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 落下位置のガイドライン */
        #guideline {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            border-left: 2px dashed rgba(200, 200, 200, 0.8);
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* アニメーション */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .pop-anim {
            animation: pop 0.3s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <div id="game-container">
        <!-- スコア・UI表示部 -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-start z-20 pointer-events-none">
            <div class="glass-panel px-4 py-2 flex flex-col items-center">
                <span class="text-xs text-gray-500 font-bold">SCORE</span>
                <span id="score-display" class="text-2xl text-orange-500 font-bold drop-shadow-sm leading-none">0</span>
            </div>
            
            <div class="glass-panel px-4 py-2 flex flex-col items-center">
                <span class="text-xs text-gray-500 font-bold">NEXT</span>
                <div id="next-fruit-display" class="text-3xl mt-1 leading-none drop-shadow-md">🍒</div>
            </div>
        </div>

        <div id="guideline"></div>

        <!-- キャンバス -->
        <canvas id="game-canvas"></canvas>

        <!-- ゲームオーバー画面 -->
        <div id="game-over-screen" class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center z-50 hidden transition-opacity duration-300">
            <div class="bg-white p-8 rounded-3xl text-center shadow-2xl transform scale-95 transition-transform duration-300" id="game-over-modal">
                <h2 class="text-4xl font-bold text-red-500 mb-2 drop-shadow-sm">GAME OVER</h2>
                <p class="text-gray-600 mb-6 font-bold">箱がいっぱいになりました！</p>
                <div class="bg-orange-50 rounded-2xl p-4 mb-8">
                    <p class="text-sm text-gray-500 mb-1 font-bold">最終スコア</p>
                    <p id="final-score" class="text-5xl font-bold text-orange-500">0</p>
                </div>
                <button id="restart-btn" class="w-full bg-gradient-to-r from-orange-400 to-red-400 hover:from-orange-500 hover:to-red-500 text-white font-bold py-4 rounded-xl shadow-lg transform transition active:scale-95 text-xl">
                    もう一度プレイ
                </button>
            </div>
        </div>
    </div>

    <script>
        // フルーツの設定データ
        // レベル, 名前, 絵文字, 半径, 獲得スコア, 背景色(描画用)
        const FRUITS = [
            { level: 0, name: 'Cherry', emoji: '🍒', radius: 16, score: 1, color: '#ff0000' },
            { level: 1, name: 'Strawberry', emoji: '🍓', radius: 24, score: 3, color: '#ff4d4d' },
            { level: 2, name: 'Grape', emoji: '🍇', radius: 32, score: 6, color: '#9933cc' },
            { level: 3, name: 'Dekopon', emoji: '🍊', radius: 40, score: 10, color: '#ff9900' },
            { level: 4, name: 'Persimmon', emoji: '柿', radius: 52, score: 15, color: '#ff6600' }, // 絵文字の都合上テキスト
            { level: 5, name: 'Apple', emoji: '🍎', radius: 64, score: 21, color: '#cc0000' },
            { level: 6, name: 'Pear', emoji: '🍐', radius: 76, score: 28, color: '#cccc00' },
            { level: 7, name: 'Peach', emoji: '🍑', radius: 92, score: 36, color: '#ff99cc' },
            { level: 8, name: 'Pineapple', emoji: '🍍', radius: 110, score: 45, color: '#ffcc00' },
            { level: 9, name: 'Melon', emoji: '🍈', radius: 130, score: 55, color: '#99ff66' },
            { level: 10, name: 'Watermelon', emoji: '🍉', radius: 160, score: 66, color: '#33cc33' }
        ];

        // 柿(Persimmon)用フォールバック絵文字の調整
        FRUITS[4].emoji = '🍅'; // 柿の標準絵文字がないためトマトで代用し色味でカバー

        // Matter.js モジュール
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Events = Matter.Events,
              Body = Matter.Body;

        // ゲーム状態の管理
        const state = {
            score: 0,
            isGameOver: false,
            canDrop: true,
            nextFruitLevel: 0,
            currentDropX: 0
        };

        // DOM要素
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const nextFruitDisplay = document.getElementById('next-fruit-display');
        const guideline = document.getElementById('guideline');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // サイズ設定
        let GAME_WIDTH = container.clientWidth;
        let GAME_HEIGHT = container.clientHeight;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // 物理エンジン初期化
        let engine, world, runner;
        let walls = [];
        let dropZoneY = 50; // 落下位置を少し上げる

        function initGame() {
            // 前回のエンジンがあれば停止・クリア
            if (engine) {
                Matter.Engine.clear(engine);
                if (runner) Matter.Runner.stop(runner);
            }

            engine = Engine.create();
            world = engine.world;
            
            // 重力調整 (もっさりしすぎないように少し強めに)
            engine.gravity.y = 1.5;

            // 壁と床の作成 (透明な物理オブジェクト)
            const wallOptions = { isStatic: true, render: { visible: false }, friction: 0.5 };
            const ground = Bodies.rectangle(GAME_WIDTH / 2, GAME_HEIGHT + 30, GAME_WIDTH * 2, 60, wallOptions);
            const leftWall = Bodies.rectangle(-30, GAME_HEIGHT / 2, 60, GAME_HEIGHT * 2, wallOptions);
            const rightWall = Bodies.rectangle(GAME_WIDTH + 30, GAME_HEIGHT / 2, 60, GAME_HEIGHT * 2, wallOptions);

            walls = [ground, leftWall, rightWall];
            Composite.add(world, walls);

            // 衝突判定イベント
            Events.on(engine, 'collisionStart', handleCollision);

            // ゲームループの設定 (MatterのRendererは使わずカスタムで描画)
            runner = Runner.create();
            Runner.run(runner, engine);

            // カスタム描画ループ
            requestAnimationFrame(renderLoop);

            // ステートのリセット
            state.score = 0;
            state.isGameOver = false;
            state.canDrop = true;
            updateScore(0);
            setNextFruit();
            gameOverScreen.classList.add('hidden');
        }

        // 次のフルーツをランダムに決定 (レベル0〜3の中から)
        function setNextFruit() {
            state.nextFruitLevel = Math.floor(Math.random() * 4);
            nextFruitDisplay.innerText = FRUITS[state.nextFruitLevel].emoji;
            
            // UIアニメーション
            nextFruitDisplay.classList.remove('pop-anim');
            void nextFruitDisplay.offsetWidth; // reflow
            nextFruitDisplay.classList.add('pop-anim');
        }

        function updateScore(points) {
            state.score += points;
            scoreDisplay.innerText = state.score;
            scoreDisplay.classList.remove('pop-anim');
            void scoreDisplay.offsetWidth;
            scoreDisplay.classList.add('pop-anim');
        }

        // フルーツを生成
        function createFruit(x, y, level, isDropping = false) {
            const fruitData = FRUITS[level];
            const fruit = Bodies.circle(x, y, fruitData.radius, {
                restitution: 0.2, // 弾性 (跳ね返り)
                friction: 0.1,    // 摩擦
                density: 0.001 * (level + 1), // 重さ(大きいほど重い)
                label: 'fruit',
                isSleeping: isDropping // 落下待機中は動かさない
            });
            
            // カスタムプロパティを追加
            fruit.fruitLevel = level;
            fruit.isMerging = false; // 二重マージ防止フラグ
            fruit.hasDropped = false; // 一度下まで落ちたかどうかのフラグ

            Composite.add(world, fruit);
            return fruit;
        }

        // 衝突処理 (マージ判定)
        function handleCollision(event) {
            const pairs = event.pairs;

            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA;
                const bodyB = pairs[i].bodyB;

                // 両方がフルーツであり、レベルが同じ場合
                if (bodyA.label === 'fruit' && bodyB.label === 'fruit') {
                    if (bodyA.fruitLevel === bodyB.fruitLevel && !bodyA.isMerging && !bodyB.isMerging) {
                        
                        // 最大レベル(スイカ)同士はマージしない
                        if (bodyA.fruitLevel >= FRUITS.length - 1) continue;

                        bodyA.isMerging = true;
                        bodyB.isMerging = true;

                        const nextLevel = bodyA.fruitLevel + 1;
                        
                        // 中間点を計算
                        const newX = (bodyA.position.x + bodyB.position.x) / 2;
                        const newY = (bodyA.position.y + bodyB.position.y) / 2;

                        // 既存のフルーツを削除
                        Composite.remove(world, [bodyA, bodyB]);

                        // 新しいフルーツを生成して追加
                        // (少しディレイを入れると物理演算が安定する)
                        setTimeout(() => {
                            const newFruit = createFruit(newX, newY, nextLevel);
                            updateScore(FRUITS[nextLevel].score);
                        }, 10);
                    }
                }
            }
        }

        // カスタム描画関数
        function renderLoop() {
            if (state.isGameOver) return;

            // 背景クリア
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            const GAME_OVER_LINE = 150;

            // ゲームオーバーラインの描画 (点線)
            ctx.beginPath();
            ctx.moveTo(0, GAME_OVER_LINE);
            ctx.lineTo(GAME_WIDTH, GAME_OVER_LINE);
            ctx.strokeStyle = "rgba(255, 100, 100, 0.5)";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]); // リセット

            // すべてのボディを描画
            const bodies = Composite.allBodies(world);
            
            // ゲームオーバー判定: ある程度の高さで静止しているフルーツがあるか
            let highestY = GAME_HEIGHT;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let body of bodies) {
                if (body.label === 'fruit') {
                    const data = FRUITS[body.fruitLevel];
                    const pos = body.position;
                    const angle = body.angle;

                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(angle);

                    // 背景の円を描画 (色付き)
                    ctx.beginPath();
                    ctx.arc(0, 0, data.radius, 0, 2 * Math.PI);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(0,0,0,0.1)";
                    ctx.stroke();

                    // 絵文字を描画
                    // レベルに応じてフォントサイズを調整 (半径の1.3〜1.5倍程度)
                    const fontSize = data.radius * 1.4; 
                    ctx.font = `${fontSize}px sans-serif`;
                    // macOS/iOS等での絵文字のずれを微調整
                    ctx.fillText(data.emoji, 0, data.radius * 0.1); 

                    ctx.restore();

                    // 一度ラインより下へ落ちたか判定
                    if (!body.hasDropped && pos.y > GAME_OVER_LINE + 50) {
                        body.hasDropped = true;
                    }

                    // ゲームオーバー判定のための最高点の更新
                    // 落下済みで、ほぼ静止しており、かつラインを超えているか
                    if (body.hasDropped && pos.y < highestY && Math.abs(body.velocity.y) < 0.1 && Math.abs(body.velocity.x) < 0.1) {
                        highestY = pos.y;
                    }
                }
            }

            // ゲームオーバーラインのチェック
            if (highestY < GAME_OVER_LINE) {
                triggerGameOver();
            }

            // 落下中のプレビュー表示 (PCのホバー時や、スマホのタッチドラッグ時)
            if (state.canDrop && state.currentDropX > 0) {
                const data = FRUITS[state.nextFruitLevel];
                ctx.save();
                ctx.globalAlpha = 0.5;
                ctx.translate(state.currentDropX, dropZoneY);
                
                ctx.beginPath();
                ctx.arc(0, 0, data.radius, 0, 2 * Math.PI);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                
                const fontSize = data.radius * 1.4;
                ctx.font = `${fontSize}px sans-serif`;
                ctx.fillText(data.emoji, 0, data.radius * 0.1);
                ctx.restore();
            }

            requestAnimationFrame(renderLoop);
        }

        // フルーツの落下処理
        function dropFruit() {
            if (!state.canDrop || state.isGameOver) return;
            state.canDrop = false;
            guideline.style.display = 'none';

            // 現在の落下位置にフルーツを生成
            const x = state.currentDropX;
            createFruit(x, dropZoneY, state.nextFruitLevel, false);

            // 次のフルーツの準備ディレイ (連打防止)
            setTimeout(() => {
                if(!state.isGameOver) {
                    setNextFruit();
                    state.canDrop = true;
                }
            }, 1000);
        }

        // マウス/タッチ座標から落下位置を計算
        function updateDropPosition(clientX) {
            if (!state.canDrop || state.isGameOver) return;
            
            const rect = container.getBoundingClientRect();
            let x = clientX - rect.left;
            
            // 壁にはみ出さないようにクランプ
            const r = FRUITS[state.nextFruitLevel].radius;
            x = Math.max(r, Math.min(GAME_WIDTH - r, x));
            
            state.currentDropX = x;
            
            // ガイドラインの位置更新
            guideline.style.display = 'block';
            guideline.style.left = `${x}px`;
        }

        // --- イベントリスナー ---

        // PCマウス操作
        container.addEventListener('mousemove', (e) => {
            updateDropPosition(e.clientX);
        });
        
        container.addEventListener('click', (e) => {
            if (state.canDrop) {
                updateDropPosition(e.clientX);
                dropFruit();
            }
        });
        
        container.addEventListener('mouseleave', () => {
            guideline.style.display = 'none';
            state.currentDropX = 0; // プレビューを隠す
        });

        // スマホタッチ操作
        container.addEventListener('touchstart', (e) => {
            e.preventDefault(); // スクロール防止
            if (e.touches.length > 0) {
                updateDropPosition(e.touches[0].clientX);
            }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                updateDropPosition(e.touches[0].clientX);
            }
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (state.canDrop) {
                dropFruit();
            }
        }, { passive: false });


        // ゲームオーバー処理
        function triggerGameOver() {
            if (state.isGameOver) return;
            state.isGameOver = true;
            Runner.stop(runner); // 物理演算停止
            
            finalScoreDisplay.innerText = state.score;
            gameOverScreen.classList.remove('hidden');
            
            // モーダルのアニメーション
            const modal = document.getElementById('game-over-modal');
            setTimeout(() => {
                modal.classList.remove('scale-95');
                modal.classList.add('scale-100');
            }, 10);
        }

        // リスタートボタン
        restartBtn.addEventListener('click', () => {
            const modal = document.getElementById('game-over-modal');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-95');
            
            setTimeout(() => {
                initGame();
            }, 300); // アニメーションを待つ
        });

        // リサイズ対応 (簡易)
        window.addEventListener('resize', () => {
            // 大幅なレイアウト崩れを防ぐためリロードを推奨するか、キャンバスサイズのみ再計算する
            // ここでは簡易的にサイズ再計算と壁の再配置を行う
            if(state.isGameOver) return;
            
            GAME_WIDTH = container.clientWidth;
            GAME_HEIGHT = container.clientHeight;
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            
            // 既存の壁を削除して再作成
            Composite.remove(world, walls);
            const wallOptions = { isStatic: true, render: { visible: false }, friction: 0.5 };
            const ground = Bodies.rectangle(GAME_WIDTH / 2, GAME_HEIGHT + 30, GAME_WIDTH * 2, 60, wallOptions);
            const leftWall = Bodies.rectangle(-30, GAME_HEIGHT / 2, 60, GAME_HEIGHT * 2, wallOptions);
            const rightWall = Bodies.rectangle(GAME_WIDTH + 30, GAME_HEIGHT / 2, 60, GAME_HEIGHT * 2, wallOptions);
            walls = [ground, leftWall, rightWall];
            Composite.add(world, walls);
        });

        // 初期化
        window.onload = () => {
            initGame();
            // 初期状態は画面中央に落下セット
            state.currentDropX = GAME_WIDTH / 2;
        };

    </script>
</body>
</html>
